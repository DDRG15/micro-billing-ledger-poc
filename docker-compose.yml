# docker-compose.yml — Micro-Billing-Ledger PoC
# ===============================================
# Configuration comes from .env, but every variable below carries a working dev
#     default, so the stack starts on a fresh clone with no .env at all.
#     That is deliberate: without defaults, a missing .env made POSTGRES_PASSWORD
#     empty and postgres refused to initialize ("Database is uninitialized and
#     superuser password is not specified"), so `docker compose up -d postgres`
#     crash-looped on the very first command a new reader runs. A demo that fails
#     on step one teaches nothing about what it was built to show.
#
#     The defaults are dev-only. Copy .env.example to .env and change every value
#     marked *** CHANGE *** before this is reachable from a network.
#
#     For running tests locally, start only the postgres service and give the suite a
#     database of its own. It TRUNCATEs every tenant table, so it refuses any database
#     whose name does not end in _test or _bench (disposable_db.py) — `billing`, which
#     this file creates, included:
#       docker compose up -d --wait postgres
#       docker compose exec postgres createdb -U postgres billing_test
#       DATABASE_URL=postgresql://postgres:postgres@localhost:5432/billing_test alembic upgrade head
#       python test_ledger.py
#     For the full stack:
#       docker compose up

# Docker's json-file driver keeps a container's stdout forever unless told otherwise; an
#     attacker-influenced log line at the webhook rate limit could fill the host disk.
x-logging: &capped-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ---------------------------------------------------------------------------
  # postgres — the database backend
  # ---------------------------------------------------------------------------
  postgres:
    logging: *capped-logs
    image: postgres:16-alpine
    networks: [billing_net]
    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB:       "${POSTGRES_DB:-billing}"
    ports:
      # Bound to 127.0.0.1 — only this machine can connect directly.
      #     All external DB access must go through the billing/worker services.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # migrate — runs alembic upgrade head before the API starts
  # ---------------------------------------------------------------------------
  migrate:
    logging: *capped-logs
    build: .
    networks: [billing_net]
    # Schema first, then the deploy-time rows that need owner rights. provision.py syncs
    #     the default tenant's signing secret from STRIPE_WEBHOOK_SECRET — a job the API
    #     used to do at import, and cannot do any more now that it connects as a role with
    #     SELECT-only on the org registry. `&&` so a failed migration stops the deploy
    #     rather than provisioning against a half-migrated schema.
    command: sh -c "alembic upgrade head && python provision.py"
    environment:
      # The OWNER connection, and the only service that gets it. Migrations issue DDL and
      #     create the restricted role, so they need rights the application must not hold.
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/billing}"
      # Read, never printed — provision.py writes it to org.stripe_webhook_secret so the
      #     legacy single-tenant route verifies against the operator's current value.
      STRIPE_WEBHOOK_SECRET:      "${STRIPE_WEBHOOK_SECRET:-whsec_YOUR_SECRET_HERE}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      # Read for its password only: provision.py sets billing_app's password to the one
      #     the services will connect with, hashed client-side. Same value billing and
      #     worker receive below, so the role and its users cannot drift apart.
      APP_DATABASE_URL:           "${APP_DATABASE_URL:-postgresql://billing_app:billing_app@postgres:5432/billing}"
    depends_on:
      postgres:
        condition: service_healthy
    # on-failure, not "no". `docker compose up` honours the service_healthy condition
    #     above, but `docker compose restart` does NOT — it bounces containers without
    #     re-evaluating depends_on, so this service came back while postgres was still
    #     restarting and died on "connection to server at postgres ... refused".
    #     Nothing was lost (the schema was already at head and the API stayed healthy),
    #     but it left a red Exited (1) next to four healthy services, which reads as a
    #     broken deploy to anyone who runs restart and looks at `docker compose ps`.
    #     Three attempts covers the seconds postgres needs; a genuinely bad migration
    #     still fails and still stops, because alembic is deterministic — retrying it
    #     cannot turn a broken migration into a working one.
    restart: on-failure:3

  # ---------------------------------------------------------------------------
  # billing — the FastAPI application
  # ---------------------------------------------------------------------------
  billing:
    logging: *capped-logs
    build: .
    networks: [billing_net]
    environment:
      # APP_DATABASE_URL only — DATABASE_URL is ABSENT from this container. It used to
      #     arrive anyway, from an ENV in the Dockerfile; that is gone, and stack.yml now
      #     asserts the absence inside the running container.
      #     billing_app is NOSUPERUSER NOBYPASSRLS, which is what makes migration 0006's
      #     policies apply instead of being decorative; the owner DSN in here would hand
      #     the same process a way around them. A service that cannot authenticate as the
      #     owner cannot drop a table or read another tenant even if its own credentials
      #     leak. Confirm which world it came up in:
      #       docker compose logs billing | grep -E 'rls_enforced|rls_inert'
      APP_DATABASE_URL:        "${APP_DATABASE_URL:-postgresql://billing_app:billing_app@postgres:5432/billing}"
      STRIPE_WEBHOOK_SECRET:   "${STRIPE_WEBHOOK_SECRET:-whsec_YOUR_SECRET_HERE}"
      BILLING_API_KEY:         "${BILLING_API_KEY:-dev_key_change_in_production}"
      # Which peer addresses may set X-Forwarded-For. uvicorn reads this env var
      #     when --forwarded-allow-ips is absent from the command line.
      #     Pinned to Caddy's static address (see the caddy service below) — NOT "*".
      #     With "*", uvicorn's ProxyHeadersMiddleware sets always_trust=True and
      #     returns x_forwarded_for_hosts[0], the leftmost and fully caller-supplied
      #     entry, so any client could forge its own rate-limit bucket key.
      #     WARNING: uvicorn 0.30.6 matches this value as an exact string, not a CIDR
      #     (proxy_headers.py builds a set() and tests `host in trusted_hosts`).
      #     A subnet like 172.28.0.0/16 here would match nothing and silently
      #     disable X-Forwarded-For entirely. Use a literal address.
      FORWARDED_ALLOW_IPS:     ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      # JSON logs in containers: stdout goes to a log driver, and one object per
      #     line is queryable without parsing rules. Unset it for plain text locally.
      LOG_FORMAT:              ${LOG_FORMAT:-json}
      # Documented in .env.example, so they have to actually reach the container.
      #     Compose forwards only the keys named here — a variable set in .env that
      #     is not listed is silently ignored, which turns a documented tunable into
      #     one that quietly does nothing in the deployment path the README recommends.
      DB_POOL_SIZE:            "${DB_POOL_SIZE:-20}"
      RATE_LIMIT_WEBHOOK:      "${RATE_LIMIT_WEBHOOK:-100/minute}"
      RATE_LIMIT_OPS:          "${RATE_LIMIT_OPS:-20/minute}"
      RATE_LIMIT_METRICS:      "${RATE_LIMIT_METRICS:-60/minute}"
      BILLING_API_KEY_FILE:      "${BILLING_API_KEY_FILE:-}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      # The two declarations that let this process serve traffic on the demo values
      #     above (ledger.py, _enforce_no_demo_credentials). Both are required: dev
      #     declared, AND the public ingress bound to loopback. INGRESS_BIND_ADDR is the
      #     same variable caddy's ports read below, so publishing the ingress beyond this
      #     machine revokes dev mode in the same edit — the service then refuses to start
      #     until every demo credential is replaced.
      #     BILLING_ENV defaults to dev HERE so a fresh clone still starts with no .env.
      #     Outside compose it defaults to unset, which is strict.
      BILLING_ENV:             "${BILLING_ENV:-dev}"
      INGRESS_BIND_ADDR:       "${INGRESS_BIND_ADDR:-127.0.0.1}"
    ports:
      # Exposed on localhost only for local development and tests.
      #     In production, traffic reaches billing through Caddy (port 443).
      #     To harden production: remove this port mapping so billing is
      #     only reachable internally via the Docker network.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, never bare "localhost". In the Alpine/musl runtime image
      #     localhost resolves to both ::1 and 127.0.0.1, musl returns ::1 first,
      #     and uvicorn binds IPv4 only (--host 0.0.0.0) — so a "localhost" probe
      #     gets Connection refused and the container reports unhealthy forever
      #     while the app is fine. Same rule applies to any k8s liveness probe.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # ---------------------------------------------------------------------------
  # worker — Transactional Outbox drain worker
  # ---------------------------------------------------------------------------
  worker:
    logging: *capped-logs
    build: .
    networks: [billing_net]
    command: python worker.py
    # SIGTERM lets the row in flight finish (DISPATCH_DEADLINE_SECONDS, 15 s by default)
    #     and hands the rest of the batch back. Docker's default 10 s grace would SIGKILL
    #     it first, stranding the batch under its lease.
    stop_grace_period: 30s
    environment:
      # Same restricted role as billing, same reason. The worker is the process that
      #     legitimately crosses tenants (outbox drain, DLQ retry claim, retention), so
      #     it is the one where an owner connection would quietly cost the most.
      APP_DATABASE_URL:    "${APP_DATABASE_URL:-postgresql://billing_app:billing_app@postgres:5432/billing}"
      DOWNSTREAM_URL:      "${DOWNSTREAM_URL:-}"
      WORKER_LOG_ONLY:     "${WORKER_LOG_ONLY:-true}"
      WORKER_BATCH_SIZE:   "${WORKER_BATCH_SIZE:-100}"
      WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-5}"
      # Pinned to 1, and NOT taken from .env like the billing service takes it.
      #     worker.py imports ledger.py, which builds its pool at import — so the worker
      #     opened DB_POOL_SIZE connections it never uses, on top of the single one
      #     _connect() gives it. Measured on a fresh stack: billing_app held 41 of the
      #     100 available (20 billing + 20 inherited + 1 real). Four worker replicas,
      #     which the round-robin drain exists to make possible, would ask for 104 and
      #     the ingest path would be the one refused.
      #
      #     The pool is not removed because the worker needs it: ledger.py's import-time
      #     self-checks run through it, and they are what make the worker log
      #     rls_enforced — which stack.yml asserts per service. One connection is enough
      #     for a check that runs once at startup.
      #
      #     minconn == maxconn still holds at 1. The pathology that rule exists for is
      #     minconn < maxconn under concurrency; nothing here is concurrent.
      DB_POOL_SIZE:        "1"
      # Same format as the billing service — correlating an event from ingest to
      #     dispatch needs both sides emitting the same shape on transaction_id.
      LOG_FORMAT:          ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      # billing_app does not exist until migration 0006 runs, and the worker cannot wait
      #     it out: it imports ledger.py, whose ThreadedConnectionPool opens its minconn
      #     connections eagerly at construction and raises there. That is an import-time
      #     failure, so the worker's own connect-retry loop never gets to run — the
      #     process exits and `restart: unless-stopped` turns it into a crash loop.
      #     Verified: building a pool against a role that does not exist raises
      #     OperationalError at __init__, not on first use.
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # caddy — reverse proxy + automatic HTTPS
  # Handles TLS termination via Let's Encrypt. Set CADDY_DOMAIN in .env
  #     to your real domain and Caddy provisions the certificate automatically.
  #     For local dev with CADDY_DOMAIN=localhost, access via https://localhost
  #     (browser will warn about self-signed cert — expected for localhost).
  #     Or skip Caddy locally and use http://localhost:8000 directly.
  # ---------------------------------------------------------------------------
  caddy:
    logging: *capped-logs
    image: caddy:2-alpine
    networks:
      billing_net:
        # Static address so the billing service can pin FORWARDED_ALLOW_IPS to a
        #     literal peer address. Without a fixed IP, Docker assigns Caddy a new
        #     address on every recreate and the pin breaks silently.
        ipv4_address: 172.28.0.10
    environment:
      # Caddy resolves {$CADDY_DOMAIN} in the Caddyfile from its OWN process
      #     environment. docker-compose's ${...} substitution applies to this YAML
      #     file, not inside the container, so without this line the placeholder
      #     expands to nothing: the site block degenerates into a global options
      #     block and Caddy aborts with "unrecognized global option: reverse_proxy".
      #     restart: unless-stopped then crash-loops it forever.
      CADDY_DOMAIN: "${CADDY_DOMAIN:-localhost}"
    ports:
      # Loopback by default. These used to publish on 0.0.0.0 while every credential
      #     above defaulted to a value printed in this repository, so the zero-setup path
      #     and the internet-facing path were the same path. To serve a real domain, set
      #     INGRESS_BIND_ADDR=0.0.0.0 in .env — the billing service reads the same
      #     variable and refuses to start until the demo credentials are replaced.
      - "${INGRESS_BIND_ADDR:-127.0.0.1}:80:80"
      - "${INGRESS_BIND_ADDR:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - billing
    restart: unless-stopped
    healthcheck:
      # Caddy's admin API answers only once the config parsed and the server started.
      #     Nothing previously gated on Caddy coming up, which is how the crash-loop
      #     above survived undetected: `docker compose up` exits 0 either way.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Explicit user-defined network with a fixed subnet.
# Required so caddy can hold a static address (see FORWARDED_ALLOW_IPS on the
#     billing service). Declaring any network here replaces the implicit default,
#     so every service must join it explicitly or lose DNS name resolution.
# ---------------------------------------------------------------------------
networks:
  billing_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  # caddy_data persists TLS certificates — prevents hitting Let's Encrypt
  #     rate limits on container restarts.
  caddy_data:
  caddy_config:

# docker-compose.yml — Micro-Billing-Ledger PoC
# ===============================================
# Configuration comes from .env, but every variable below carries a working dev
#     default, so the stack starts on a fresh clone with no .env at all.
#     That is deliberate: without defaults, a missing .env made POSTGRES_PASSWORD
#     empty and postgres refused to initialize ("Database is uninitialized and
#     superuser password is not specified"), so `docker compose up -d postgres`
#     crash-looped on the very first command a new reader runs. A demo that fails
#     on step one teaches nothing about what it was built to show.
#
#     The defaults are dev-only. Copy .env.example to .env and change every value
#     marked *** CHANGE *** before this is reachable from a network.
#
#     For running tests locally, start only the postgres service:
#       docker compose up -d postgres
#       python test_ledger.py
#     For the full stack:
#       docker compose up

services:

  # ---------------------------------------------------------------------------
  # postgres — the database backend
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    networks: [billing_net]
    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB:       "${POSTGRES_DB:-billing}"
    ports:
      # Bound to 127.0.0.1 — only this machine can connect directly.
      #     All external DB access must go through the billing/worker services.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # migrate — runs alembic upgrade head before the API starts (Phase 10)
  # ---------------------------------------------------------------------------
  migrate:
    build: .
    networks: [billing_net]
    command: alembic upgrade head
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/billing}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # billing — the FastAPI application
  # ---------------------------------------------------------------------------
  billing:
    build: .
    networks: [billing_net]
    environment:
      DATABASE_URL:            "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/billing}"
      STRIPE_WEBHOOK_SECRET:   "${STRIPE_WEBHOOK_SECRET:-whsec_YOUR_SECRET_HERE}"
      BILLING_API_KEY:         "${BILLING_API_KEY:-dev_key_change_in_production}"
      # Which peer addresses may set X-Forwarded-For. uvicorn reads this env var
      #     when --forwarded-allow-ips is absent from the command line.
      #     Pinned to Caddy's static address (see the caddy service below) — NOT "*".
      #     With "*", uvicorn's ProxyHeadersMiddleware sets always_trust=True and
      #     returns x_forwarded_for_hosts[0], the leftmost and fully caller-supplied
      #     entry, so any client could forge its own rate-limit bucket key.
      #     WARNING: uvicorn 0.30.6 matches this value as an exact string, not a CIDR
      #     (proxy_headers.py builds a set() and tests `host in trusted_hosts`).
      #     A subnet like 172.28.0.0/16 here would match nothing and silently
      #     disable X-Forwarded-For entirely. Use a literal address.
      FORWARDED_ALLOW_IPS:     ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      # JSON logs in containers: stdout goes to a log driver, and one object per
      #     line is queryable without parsing rules. Unset it for plain text locally.
      LOG_FORMAT:              ${LOG_FORMAT:-json}
    ports:
      # Exposed on localhost only for local development and tests.
      #     In production, traffic reaches billing through Caddy (port 443).
      #     To harden production: remove this port mapping so billing is
      #     only reachable internally via the Docker network.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, never bare "localhost". In the Alpine/musl runtime image
      #     localhost resolves to both ::1 and 127.0.0.1, musl returns ::1 first,
      #     and uvicorn binds IPv4 only (--host 0.0.0.0) — so a "localhost" probe
      #     gets Connection refused and the container reports unhealthy forever
      #     while the app is fine. Same rule applies to any k8s liveness probe.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # ---------------------------------------------------------------------------
  # worker — Transactional Outbox drain worker
  # ---------------------------------------------------------------------------
  worker:
    build: .
    networks: [billing_net]
    command: python worker.py
    environment:
      DATABASE_URL:        "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/billing}"
      DOWNSTREAM_URL:      "${DOWNSTREAM_URL:-}"
      WORKER_LOG_ONLY:     "${WORKER_LOG_ONLY:-true}"
      WORKER_BATCH_SIZE:   "${WORKER_BATCH_SIZE:-100}"
      WORKER_POLL_INTERVAL: "${WORKER_POLL_INTERVAL:-5}"
      # Same format as the billing service — correlating an event from ingest to
      #     dispatch needs both sides emitting the same shape on transaction_id.
      LOG_FORMAT:          ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # caddy — reverse proxy + automatic HTTPS (Phase 8)
  # Handles TLS termination via Let's Encrypt. Set CADDY_DOMAIN in .env
  #     to your real domain and Caddy provisions the certificate automatically.
  #     For local dev with CADDY_DOMAIN=localhost, access via https://localhost
  #     (browser will warn about self-signed cert — expected for localhost).
  #     Or skip Caddy locally and use http://localhost:8000 directly.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    networks:
      billing_net:
        # Static address so the billing service can pin FORWARDED_ALLOW_IPS to a
        #     literal peer address. Without a fixed IP, Docker assigns Caddy a new
        #     address on every recreate and the pin breaks silently.
        ipv4_address: 172.28.0.10
    environment:
      # Caddy resolves {$CADDY_DOMAIN} in the Caddyfile from its OWN process
      #     environment. docker-compose's ${...} substitution applies to this YAML
      #     file, not inside the container, so without this line the placeholder
      #     expands to nothing: the site block degenerates into a global options
      #     block and Caddy aborts with "unrecognized global option: reverse_proxy".
      #     restart: unless-stopped then crash-loops it forever.
      CADDY_DOMAIN: "${CADDY_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - billing
    restart: unless-stopped
    healthcheck:
      # Caddy's admin API answers only once the config parsed and the server started.
      #     Nothing previously gated on Caddy coming up, which is how the crash-loop
      #     above survived undetected: `docker compose up` exits 0 either way.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Explicit user-defined network with a fixed subnet.
# Required so caddy can hold a static address (see FORWARDED_ALLOW_IPS on the
#     billing service). Declaring any network here replaces the implicit default,
#     so every service must join it explicitly or lose DNS name resolution.
# ---------------------------------------------------------------------------
networks:
  billing_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  # caddy_data persists TLS certificates — prevents hitting Let's Encrypt
  #     rate limits on container restarts.
  caddy_data:
  caddy_config:
